<!DOCTYPE html>

<html class="h-full bg-surface-muted" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>MSBI Marketing CRM - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-dim": "#ccdbf4",
                        "primary": "#073442",
                        "surface-variant": "#d5e3fd",
                        "on-secondary-container": "#386977",
                        "primary-fixed": "#c1e9fa",
                        "surface-container": "#e6eeff",
                        "primary-container": "#244b59",
                        "on-tertiary-fixed-variant": "#354a4e",
                        "on-error": "#ffffff",
                        "surface-container-low": "#eff4ff",
                        "inverse-surface": "#233144",
                        "surface-bright": "#f8f9ff",
                        "surface-container-high": "#dde9ff",
                        "status-error": "#EF4444",
                        "on-error-container": "#93000a",
                        "primary-fixed-dim": "#a5ccdd",
                        "secondary-fixed-dim": "#9dcedd",
                        "surface": "#f8f9ff",
                        "status-success": "#10B981",
                        "on-secondary-fixed-variant": "#184d5a",
                        "on-secondary-fixed": "#001f26",
                        "on-surface-variant": "#41484b",
                        "inverse-primary": "#a5ccdd",
                        "on-tertiary": "#ffffff",
                        "outline": "#71787b",
                        "status-warning": "#F59E0B",
                        "on-tertiary-container": "#a2b9bd",
                        "surface-muted": "#F8FAFC",
                        "background": "#f8f9ff",
                        "on-primary-container": "#93bacb",
                        "surface-container-lowest": "#ffffff",
                        "error": "#ba1a1a",
                        "tertiary": "#1f3337",
                        "on-surface": "#0d1c2f",
                        "secondary-fixed": "#b9eafa",
                        "inverse-on-surface": "#ebf1ff",
                        "on-tertiary-fixed": "#091f22",
                        "secondary": "#346572",
                        "outline-variant": "#c1c7cb",
                        "on-primary-fixed-variant": "#254c5a",
                        "on-secondary": "#ffffff",
                        "on-primary-fixed": "#001f29",
                        "error-container": "#ffdad6",
                        "tertiary-fixed-dim": "#b4cbcf",
                        "surface-tint": "#3e6472",
                        "border-subtle": "#E2E8F0",
                        "secondary-container": "#b6e8f7",
                        "on-background": "#0d1c2f",
                        "surface-container-highest": "#d5e3fd",
                        "on-primary": "#ffffff",
                        "tertiary-container": "#354a4d",
                        "tertiary-fixed": "#d0e7eb"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "base": "8px",
                        "container-max": "1440px",
                        "margin-md": "24px",
                        "margin-sm": "16px",
                        "margin-lg": "48px",
                        "gutter": "20px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Hanken Grotesk"],
                        "body-sm": ["Inter"],
                        "headline-sm": ["Hanken Grotesk"],
                        "body-lg": ["Inter"],
                        "data-mono": ["Inter"],
                        "body-md": ["Inter"],
                        "label-md": ["Inter"],
                        "headline-md": ["Hanken Grotesk"],
                        "display-lg": ["Hanken Grotesk"]
                    },
                    "fontSize": {
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "600" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "data-mono": ["14px", { "lineHeight": "20px", "fontWeight": "500" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="h-full bg-surface-muted text-on-surface font-body-md antialiased flex flex-col justify-center py-12 sm:px-6 lg:px-8">
<!-- Transactional Screen - Navigation is Suppressed -->
<div class="sm:mx-auto sm:w-full sm:max-w-md">
<!-- Logo Header -->
<div class="flex justify-center mb-8">
<!-- Using SVG from Design System or Fallback Text -->
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary" style="font-size: 40px; font-variation-settings: 'FILL' 1;">neurology</span>
<div class="flex flex-col">
<span class="font-headline-md text-headline-md text-primary tracking-tight">MSBI CRM</span>
<span class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Marketing Portal</span>
</div>
</div>
</div>
<h2 class="mt-6 text-center font-headline-lg text-headline-lg text-on-surface">
            Sign in to your account
        </h2>
<p class="mt-2 text-center font-body-sm text-body-sm text-on-surface-variant">
            Secure access for authorized personnel only.
        </p>
</div>
<div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
<div class="bg-surface-container-lowest py-8 px-4 shadow-sm border border-border-subtle sm:rounded-lg sm:px-10">
<form action="#" class="space-y-6" method="POST">
<!-- Email Field -->
<div>
<label class="block font-body-sm text-body-sm text-on-surface font-medium" for="email">
                        Email address
                    </label>
<div class="mt-1 relative">
<input autocomplete="email" class="appearance-none block w-full px-3 py-2 border border-border-subtle rounded-DEFAULT shadow-sm placeholder-outline-variant focus:outline-none focus:ring-2 focus:ring-secondary-fixed-dim focus:border-transparent font-body-sm text-body-sm sm:text-sm" id="email" name="email" required="" type="email"/>
<div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline-variant text-sm">mail</span>
</div>
</div>
</div>
<!-- Password Field -->
<div>
<label class="block font-body-sm text-body-sm text-on-surface font-medium" for="password">
                        Password
                    </label>
<div class="mt-1 relative">
<input autocomplete="current-password" class="appearance-none block w-full px-3 py-2 border border-border-subtle rounded-DEFAULT shadow-sm placeholder-outline-variant focus:outline-none focus:ring-2 focus:ring-secondary-fixed-dim focus:border-transparent font-body-sm text-body-sm sm:text-sm" id="password" name="password" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center cursor-pointer text-outline-variant hover:text-primary transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined text-sm" id="visibility-icon">visibility</span>
</button>
</div>
</div>
<!-- Remember Me & Forgot Password -->
<div class="flex items-center justify-between">
<div class="flex items-center">
<input class="h-4 w-4 text-primary focus:ring-primary-container border-border-subtle rounded-sm" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block font-body-sm text-body-sm text-on-surface-variant" for="remember-me">
                            Remember me
                        </label>
</div>
<div class="text-sm">
<a class="font-body-sm text-body-sm font-medium text-primary hover:text-primary-container transition-colors" href="#">
                            Forgot your password?
                        </a>
</div>
</div>
<!-- Sign In Button -->
<div>
<button class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-DEFAULT shadow-sm font-body-md text-body-md font-medium text-white bg-primary-container hover:bg-primary focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors" type="submit">
                        Sign in
                    </button>
</div>
</form>
<div class="mt-6">
<div class="relative">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-border-subtle"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="px-2 bg-surface-container-lowest text-on-surface-variant font-label-md text-label-md">
                            Or continue with
                        </span>
</div>
</div>
<div class="mt-6">
<!-- SSO Button (UI Only) -->
<button class="w-full flex justify-center items-center gap-2 py-2.5 px-4 border border-border-subtle rounded-DEFAULT shadow-sm bg-surface-container-lowest font-body-sm text-body-sm font-medium text-on-surface hover:bg-surface-muted transition-colors" type="button">
<span class="material-symbols-outlined text-primary text-base">vpn_key</span>
                        MSBI Single Sign-On (SSO)
                    </button>
</div>
</div>
</div>
<!-- Footer / Legal -->
<div class="mt-8 text-center font-label-md text-label-md text-on-surface-variant">
<p>© 2024 Midwest Spine &amp; Brain Institute. All rights reserved.</p>
<div class="mt-2 flex justify-center gap-4">
<a class="hover:text-primary transition-colors" href="#">Privacy Policy</a>
<a class="hover:text-primary transition-colors" href="#">Terms of Service</a>
<a class="hover:text-primary transition-colors" href="#">IT Support</a>
</div>
</div>
</div>
<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const visibilityIcon = document.getElementById('visibility-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                visibilityIcon.textContent = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                visibilityIcon.textContent = 'visibility';
            }
        }
    </script>
</body></html>
